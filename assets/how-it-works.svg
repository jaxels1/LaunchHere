  <pattern id="chevrons" width="32" height="32" patternUnits="userSpaceOnUse"><path d="m12 12 4 4-4 4" fill="none" stroke="#436281" stroke-width="1" opacity=".18"/></pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="m0 0 7 3-7 3" fill="none" stroke="#91b5de" stroke-width="1.5"/></marker>
</defs>
